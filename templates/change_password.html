<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>SIGE - Alterar Palavra-passe</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="brand">SIGE | Troca de Senha</div>
        <a href="/">Voltar</a>
    </div>
    <div class="container" style="max-width:450px;">
        <div class="card">
            <h3 class="card-title">Alterar Palavra-passe da Conta</h3>
            <form action="/change-password" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>Palavra-passe Atual:*</label>
                    <input type="password" name="senha_atual" required>
                </div>
                <div class="form-group">
                    <label>Nova Palavra-passe:*</label>
                    <input type="password" name="nova_senha" required>
                </div>
                <button type="submit" class="btn btn-success" style="width:100%;">Atualizar Palavra-passe</button>
            </form>
        </div>
    </div>
</body>
</html>
