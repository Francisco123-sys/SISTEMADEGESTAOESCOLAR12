<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>SIGE - Editar Colega</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="brand">SIGE | Editar Colega {{ colega.code }}</div>
        <a href="/secretary/colaboradores">Voltar</a>
    </div>
    <div class="container" style="max-width:500px;">
        <div class="card">
            <h3 class="card-title">Editar Dados de {{ colega.nome }}</h3>
            <form method="POST">
                <div class="form-group">
                    <label>Nome Completo:*</label>
                    <input type="text" name="nome" value="{{ colega.nome }}" required>
                </div>
                <div class="form-group">
                    <label>Email:*</label>
                    <input type="email" name="email" value="{{ colega.email }}" required>
                </div>
                <div class="form-group">
                    <label>Contacto:*</label>
                    <input type="text" name="contacto" value="{{ colega.contacto or '' }}" required>
                </div>
                <button type="submit" class="btn btn-success" style="width:100%;">Guardar Alterações</button>
            </form>
        </div>
    </div>
</body>
</html>
