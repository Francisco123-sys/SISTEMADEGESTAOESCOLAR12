<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Definir nova palavra-passe | SIGE</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="container" style="max-width:520px; padding-top:48px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <section class="card">
            <h1 class="card-title">Definir nova palavra-passe</h1>
            <p>A nova palavra-passe deve ter pelo menos 12 caracteres.</p>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="new_password">Nova palavra-passe</label>
                    <input id="new_password" type="password" name="new_password"
                           minlength="12" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirmar palavra-passe</label>
                    <input id="confirm_password" type="password" name="confirm_password"
                           minlength="12" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Alterar palavra-passe</button>
            </form>
        </section>
    </main>
</body>
</html>
