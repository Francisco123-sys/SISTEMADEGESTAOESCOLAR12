<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>SIGE - Editar Funcionário</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {% from 'components/dashboard_ui.html' import institutional_page_header with context %}
    {{ institutional_page_header('Edição de Funcionário') }}
    <div class="navbar">
        <div class="brand">SIGE | Editar Funcionário {{ staff.code }}</div>
        <a href="/director/dashboard">Voltar ao Painel</a>
    </div>
    <div class="container" style="max-width:550px;">
        <div class="card">
            <h3 class="card-title">Editar Dados de {{ staff.nome }}</h3>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>Nome Completo:*</label>
                    <input type="text" name="nome" value="{{ staff.nome }}" required>
                </div>
                <div class="form-group">
                    <label>Email:*</label>
                    <input type="email" name="email" value="{{ staff.email }}" required>
                </div>
                <div class="form-group">
                    <label>Contacto:*</label>
                    <input type="text" name="contacto" value="{{ staff.contacto or '' }}" required>
                </div>
                <div class="form-group">
                    <label>Cargo:*</label>
                    <select name="role">
                        <option value="pedagogico_1" {% if staff.role == 'pedagogico_1' %}selected{% endif %}>Director Pedagógico 1º Ciclo</option>
                        <option value="pedagogico_2" {% if staff.role == 'pedagogico_2' %}selected{% endif %}>Director Pedagógico 2º Ciclo</option>
                        <option value="chefe_secretaria" {% if staff.role == 'chefe_secretaria' %}selected{% endif %}>Chefe da Secretaria</option>
                        <option value="secretary" {% if staff.role == 'secretary' %}selected{% endif %}>Assistente de Secretaria</option>
                        <option value="teacher" {% if staff.role == 'teacher' %}selected{% endif %}>Professor</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success" style="width:100%;">Guardar Alterações</button>
            </form>
        </div>
    </div>
</body>
</html>
